services:
  # ── 1. Backend NestJS REST API ──────────────────────────────────────────────
  - type: web
    name: billing-saas-api
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false

  # ── 2. Frontend Next.js Web App ─────────────────────────────────────────────
  - type: web
    name: billing-saas-web
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
